name: 1. Validate Secrets
run-name: Validate Secrets
on: [workflow_call, workflow_dispatch]

jobs:
  validate-access-token:
    name: Access
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Validate Access Token
        run: |
          set -o pipefail

          if [ -z "$GH_PAT" ]; then
            echo "::error::The GH_PAT secret is not available to this repository. Add it (or allow this repository to use the organization secret) and try again."
            exit 2
          fi

          # The x-oauth-scopes header lists what a classic token is allowed to do.
          if ! scopes=$(curl -sS -f -I -H "Authorization: token $GH_PAT" https://api.github.com | { grep -i '^x-oauth-scopes:' || true; } | cut -d ' ' -f2- | tr -d '\r'); then
            echo "::error::GitHub rejected the GH_PAT secret. Check at https://github.com/settings/tokens that the token exists and has not expired, then update the secret."
            exit 2
          fi

          if [[ $scopes =~ repo ]]; then
            echo "The GH_PAT secret is valid and has the 'repo' permission."
          elif [ -z "$scopes" ]; then
            echo "The GH_PAT secret is valid. It does not report its permissions (fine-grained token), so 'repo' access is assumed."
          else
            echo "::error::The GH_PAT secret is valid but only has these permissions: $scopes. It needs 'repo' to read the Match-Secrets repository."
            exit 2
          fi

      - name: Validate Match-Secrets
        run: |
          set -o pipefail
          repo="${{ github.repository_owner }}/Match-Secrets"

          if ! visibility=$(gh repo view "$repo" --json visibility --jq '.visibility | ascii_downcase' 2>/dev/null); then
            echo "No '$repo' repository was found with the GH_PAT secret. Creating a private one..."
            if gh repo create "$repo" --private >/dev/null && [ "$(gh repo view "$repo" --json visibility --jq '.visibility | ascii_downcase')" == "private" ]; then
              echo "Created a private '$repo' repository."
            else
              echo "::error::Could not create a private '$repo' repository. Create it by hand (it must be private) and try again."
              exit 2
            fi
          elif [ "$visibility" == "public" ]; then
            echo "::error::'$repo' exists but is public. Make it private (or delete it) and try again."
            exit 2
          else
            echo "Found a private '$repo' repository to use."
          fi

  validate-fastlane-secrets:
    name: Fastlane
    needs: [validate-access-token]
    runs-on: macos-26
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      TEAMID: ${{ secrets.TEAMID }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Project Dependencies
        run: bundle install

      - name: Keep signing details out of the public log
        run: ./.github/scripts/quiet_fastlane.sh

      # Apple rejects API tokens when the runner clock has drifted (https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Validate Fastlane Secrets
        run: |
          # Validate TEAMID
          if [ -z "$TEAMID" ]; then
            failed=true
            echo "::error::The TEAMID secret is unset or empty. Set it and try again."
          elif [ ${#TEAMID} -ne 10 ] || ! [[ $TEAMID =~ ^[A-Z0-9]+$ ]]; then
            failed=true
            echo "::error::The TEAMID secret is set but is not a 10-character Apple Team ID (uppercase letters and numbers)."
          fi

          # Validate MATCH_PASSWORD
          if [ -z "$MATCH_PASSWORD" ]; then
            failed=true
            echo "::error::The MATCH_PASSWORD secret is unset or empty. Set it and try again."
          fi

          # Ensure that fastlane exit codes are handled when output is piped.
          set -o pipefail

          # Validate FASTLANE_ISSUER_ID, FASTLANE_KEY_ID, and FASTLANE_KEY
          FASTLANE_KEY_ID_PATTERN='^[A-Z0-9]+$'
          FASTLANE_ISSUER_ID_PATTERN='^\{?[A-F0-9a-f]{8}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{4}-[A-F0-9a-f]{12}\}?$'

          if [ -z "$FASTLANE_ISSUER_ID" ] || [ -z "$FASTLANE_KEY_ID" ] || [ -z "$FASTLANE_KEY" ]; then
            failed=true
            [ -z "$FASTLANE_ISSUER_ID" ] && echo "::error::The FASTLANE_ISSUER_ID secret is unset or empty. Set it and try again."
            [ -z "$FASTLANE_KEY_ID"    ] && echo "::error::The FASTLANE_KEY_ID secret is unset or empty. Set it and try again."
            [ -z "$FASTLANE_KEY"       ] && echo "::error::The FASTLANE_KEY secret is unset or empty. Set it and try again."
          elif [ ${#FASTLANE_KEY_ID} -ne 10 ] || ! [[ $FASTLANE_KEY_ID =~ $FASTLANE_KEY_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_KEY_ID secret is set but invalid. Copy it again from the 'Keys' tab at https://appstoreconnect.apple.com/access/integrations/api."
          elif ! [[ $FASTLANE_ISSUER_ID =~ $FASTLANE_ISSUER_ID_PATTERN ]]; then
            failed=true
            echo "::error::The FASTLANE_ISSUER_ID secret is set but invalid. Copy it again from the 'Keys' tab at https://appstoreconnect.apple.com/access/integrations/api."
          elif ! echo "$FASTLANE_KEY" | openssl pkcs8 -nocrypt >/dev/null; then
            failed=true
            echo "::error::The FASTLANE_KEY secret is set but invalid. Copy it again from the API key file (*.p8) you downloaded."
          elif ! bundle exec fastlane validate_secrets 2>&1 | tee fastlane.log; then
            if grep -q "Couldn't decrypt the repo" fastlane.log; then
              failed=true
              echo "::error::The MATCH_PASSWORD secret cannot decrypt the Match-Secrets repository. Check that it is the same password your other apps use."
            elif grep -q -e "required agreement" -e "license agreement" fastlane.log; then
              failed=true
              echo "::error::Apple has an updated developer program license agreement waiting. Accept it at https://developer.apple.com/account, wait a few minutes, and try again."
            elif grep -q "Your certificate .* is not valid" fastlane.log; then
              echo "::notice::The Distribution certificate is invalid or expired. '3. Create Certificates' will try to renew it."
            elif grep -q -e "Authentication credentials are missing or invalid" -e "NOT_AUTHORIZED" fastlane.log; then
              failed=true
              echo "::error::Apple rejected the App Store Connect API key. Check FASTLANE_ISSUER_ID, FASTLANE_KEY_ID and FASTLANE_KEY."
            else
              echo "::warning::fastlane reported a problem while checking the secrets. Open this step's log for the reason. This is expected the first time, before any certificate exists."
            fi
          fi

          # Exit unsuccessfully if secret validation failed.
          if [ $failed ]; then
            exit 2
          fi
